# Configuration file
# key = value
quarkus.smallrye-openapi.info-title=InkluSport - API de eventos
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para gestionar eventos y recursos deportivos inclusivos

# Ruta de la especificación OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Ruta de Swagger UI
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# Configurar la versión de la especificación
quarkus.smallrye-openapi.open-api-version=3.1.0

# Identificadores de operaciones automáticamente
quarkus.smallrye-openapi.operation-id-strategy=METHOD

# Personalizar Swagger UI
quarkus.swagger-ui.title=InkluSport - Documentación API
quarkus.swagger-ui.theme=material
quarkus.swagger-ui.display-operation-id=true
quarkus.swagger-ui.doc-expansion=list
quarkus.swagger-ui.filter=true